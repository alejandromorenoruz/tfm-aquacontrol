version: '3'

services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    hostname: wazuh-certs-generator
    volumes:
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/:/certificates/
      - ./wazuh-dashboard-config/certs.yml:/config/certs.yml
