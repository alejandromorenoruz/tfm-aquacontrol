# TFM AquaControl S.A. - Laboratorio ICS/SCADA
# Redes IT/OT separadas + firewall lógico (ver diagrama de arquitectura corregida)
# Probar SIEMPRE en un ordenador distinto al propio antes de entregar.

networks:
  red_it:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  red_ot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

services:

  openplc:
    image: tuttas/openplc_v3:latest
    # Login web: usuario "openplc", contraseña "openplc"
    container_name: openplc
    hostname: openplc
    restart: unless-stopped
    networks:
      red_ot:
        ipv4_address: 172.21.0.10
    ports:
      - "8080:8080"   # interfaz web de gestión
      - "502:502"     # Modbus TCP (vector de ataque)

  conpot:
    image: honeynet/conpot:latest
    container_name: conpot
    hostname: conpot
    restart: unless-stopped
    networks:
      red_ot:
        ipv4_address: 172.21.0.11
    ports:
      - "8800:8800"

  modbus-sensor:
    build: ./modbus-sensor
    container_name: modbus-sensor
    restart: unless-stopped
    depends_on:
      - openplc
    network_mode: "service:openplc"   # comparte la interfaz de red de OpenPLC
    cap_add:
      - NET_RAW
      - NET_ADMIN

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    networks:
      red_it:
        ipv4_address: 172.20.0.10
      red_ot:
        ipv4_address: 172.21.0.20
    ports:
      - "1514:1514/udp"   # agentes
      - "1515:1515"       # registro de agentes
      - "55000:55000"     # API REST
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh-dashboard-config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./aquacontrol_rules.xml:/wazuh-config-mount/etc/rules/aquacontrol_rules.xml

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      red_it:
        ipv4_address: 172.20.0.30
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh-dashboard-config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh-dashboard-config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    networks:
      red_it:
        ipv4_address: 172.20.0.40
    ports:
      - "8443:5601"   # https://localhost:8443
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh-dashboard-config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-dashboard-config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh-dashboard-config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config-data:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager

  kali:
    build: ./kali
    container_name: kali
    hostname: kali
    tty: true
    stdin_open: true
    restart: unless-stopped
    command: /bin/bash
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      red_it:
        ipv4_address: 172.20.0.50   # atacante ya "dentro" de IT...
      red_ot:
        ipv4_address: 172.21.0.50   # ...con acceso directo a OT (deficiencia inicial)

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config-data:
  wazuh-dashboard-custom:
